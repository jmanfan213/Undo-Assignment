<!doctype html>
<html>
  <head>
    <title>Create HTML5 Canvas JavaScript Drawing App Example</title>
    <style>
  #command-history {
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 10px 10px 10px 40px;
  }
</style>
  </head>
  <body>
    <div id="canvasDiv"></div>
    <!--[if IE
      ]><script type="text/javascript" src="excanvas.js"></script
    ><![endif]-->
    <script type="text/javascript" src="html5-canvas-drawing-app.js"></script>
    <script type="text/javascript">
      drawingApp.init();
    </script>
    <div id="history-panel">
      <h4>History</h4>
      <ul id="history-list"></ul>
      <button type="button" onclick="drawingApp.undo()">Undo</button>
      <button type="button" onclick="drawingApp.redo()">Redo</button>
      <ol id="command-history"></ol>
    </div>
  </body>
</html>
